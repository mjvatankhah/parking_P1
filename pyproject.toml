[project]
name = "computer-vision-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "kivy>=2.3.1",
    "matplotlib>=3.11.1,<4",
    "onnx>=1.23.0",
    "onnxruntime>=1.29.0",
    "onnxslim>=0.1.96",
    "opencv-python>=5.0.0.93",
    "openvino>=2026.4.0",
    "psycopg>=3.3.5",
    "psycopg2-binary>=2.9.12",
    "python-bidi>=0.6.11",
    "ultralytics>=8.4.135",
]

[project.scripts]
plakino = "computer_vision_v2.main_v2:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["computer_vision_v2", "reno"]
