[project]
name = "computer-vision-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "kivy>=2.3.1",
    "onnxruntime>=1.29.0",
    "opencv-python>=5.0.0.93",
    "psycopg>=3.3.5",
    "psycopg2-binary>=2.9.12",
    "python-bidi>=0.6.11",
    "ultralytics>=8.4.135",
]

[project.scripts]
plakino = "computer_vision_v2.main_v2:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
